# Fix The Variable Substitution
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-094-lab-020-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-094-lab-020-03-setup"
      description: "Creates the Secret fleet-auth and the ConfigMap cluster-vars, and applies a GitRepository and a Flux Kustomization with a wrong substituteFrom kind and a wrong targetNamespace"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-substitute-from-configmap"
      description: "Confirms podinfo reads variables from ConfigMap/cluster-vars, prunes and is Ready"
      type: "file"
      source: "validation/validate-substitute-from-configmap.sh"
    - name: "validate-message-from-configmap"
      description: "Confirms the Deployment podinfo has the ConfigMap message, 2 ready replicas and the Flux label"
      type: "file"
      source: "validation/validate-message-from-configmap.sh"
    - name: "validate-no-stray-namespace"
      description: "Confirms the application runs only in the namespace podinfo and staging was not created"
      type: "file"
      source: "validation/validate-no-stray-namespace.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
