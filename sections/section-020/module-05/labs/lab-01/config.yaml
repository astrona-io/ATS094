# Route The Flux Events
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-094-lab-020-05"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-094-lab-020-05-setup"
      description: "Deploys podinfo with Flux and creates a generic Provider and an Alert with a wrong providerRef, wrong event source namespaces and a wrong severity"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-alert-ready"
      description: "Confirms the Alert is Ready and uses the Provider team-webhook"
      type: "file"
      source: "validation/validate-alert-ready.sh"
    - name: "validate-event-sources"
      description: "Confirms the event sources are the Kustomization podinfo and the GitRepository fleet in flux-system"
      type: "file"
      source: "validation/validate-event-sources.sh"
    - name: "validate-severity-info"
      description: "Confirms the Alert sends informational events"
      type: "file"
      source: "validation/validate-severity-info.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
