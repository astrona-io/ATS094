# The starting Flux objects for ats-094-lab-020-02. Both apply without an error.
# The GitRepository is wrong in two ways: its secretRef names a Secret that does
# not exist (the Secret is fleet-auth), and it follows the branch main, which
# holds a commit that was never reviewed. The tag release-1 marks the reviewed state.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet
  namespace: flux-system
spec:
  interval: 1m
  url: http://gitea.localtest.me:3000/gitops/fleet.git
  ref:
    branch: main
  secretRef:
    name: fleet-credentials
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/podinfo
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: fleet
