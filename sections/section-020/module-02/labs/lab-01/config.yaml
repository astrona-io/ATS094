# Pin The GitRepository To The Reviewed Release
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-094-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-094-lab-020-02-setup"
      description: "Tags the reviewed commit, adds an unreviewed commit to main, and applies a GitRepository with a wrong Secret name that follows main"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-source-pinned"
      description: "Confirms fleet uses fleet-auth, follows the tag release-1 and is Ready on a release-1 revision"
      type: "file"
      source: "validation/validate-source-pinned.sh"
    - name: "validate-sync-on-tag"
      description: "Confirms podinfo applies ./apps/podinfo, prunes and applied the release-1 revision"
      type: "file"
      source: "validation/validate-sync-on-tag.sh"
    - name: "validate-only-reviewed-workloads"
      description: "Confirms podinfo runs from Flux and the Deployment unreviewed does not exist"
      type: "file"
      source: "validation/validate-only-reviewed-workloads.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
