# Make The Image Policy Select And Update
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-094-lab-020-06"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-094-lab-020-06-setup"
      description: "Deploys podinfo 6.5.0 with Flux and creates image objects with a policy range that matches nothing and an automation path that finds no marker"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-policy-selects-6x"
      description: "Confirms the ImagePolicy is Ready and selects a 6.x tag"
      type: "file"
      source: "validation/validate-policy-selects-6x.sh"
    - name: "validate-automation-pushed"
      description: "Confirms the ImageUpdateAutomation pushed a commit"
      type: "file"
      source: "validation/validate-automation-pushed.sh"
    - name: "validate-deployment-updated"
      description: "Confirms the Deployment runs the selected tag applied by Flux"
      type: "file"
      source: "validation/validate-deployment-updated.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
