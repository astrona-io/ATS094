# Knowledge check for module 03 of section 030. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats094-030-m03
course_id: ATS094
exam_code: FLUX
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-030-module-03
  title: "Upgrading, Customizing And Uninstalling Flux"
placement:
  position: after
  reading: sections/section-030/module-03/labs/lab-01/question.md
questions:
  - id: ats094-030-m03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Check before upgrading"
    source_readings:
      - sections/section-030/module-03/course-01-upgrading-flux.md
    prompt: "Which command tests the prerequisites of a cluster before an upgrade?"
    options:
      - id: a
        text: "`flux check --pre`"
        explanation: "Correct. flux check --pre tests the Kubernetes version and the connection before anything is installed or changed."
      - id: b
        text: "`flux get all`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: c
        text: "`flux export --all`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: d
        text: "`flux trace`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
    correct_option: a
    explanation: "Correct. flux check --pre tests the Kubernetes version and the connection before anything is installed or changed."

  - id: ats094-030-m03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compare versions"
    source_readings:
      - sections/section-030/module-03/course-01-upgrading-flux.md
    prompt: "Which command shows the version of the CLI and of the controllers in the cluster?"
    options:
      - id: a
        text: "`flux version --client`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: b
        text: "`flux check --pre`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: c
        text: "`flux get sources`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: d
        text: "`flux version`"
        explanation: "Correct. Without --client, flux version also reads the controller versions from the cluster."
    correct_option: d
    explanation: "Correct. Without --client, flux version also reads the controller versions from the cluster."

  - id: ats094-030-m03-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Upgrade a bootstrapped cluster"
    source_readings:
      - sections/section-030/module-03/course-01-upgrading-flux.md
    prompt: "How do you upgrade a cluster that was set up with `flux bootstrap`?"
    options:
      - id: a
        text: "Edit each controller Deployment with `kubectl edit`."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: b
        text: "Delete the namespace flux-system and install again."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: c
        text: "Run the bootstrap command again with the newer CLI, which commits new component manifests that Flux applies to itself."
        explanation: "Correct. The manifests live in Git, so the upgrade is a commit that can be reviewed and reverted."
      - id: d
        text: "Run `flux uninstall` and then `flux get all`."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
    correct_option: c
    explanation: "Correct. The manifests live in Git, so the upgrade is a commit that can be reviewed and reverted."

  - id: ats094-030-m03-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Add optional components"
    source_readings:
      - sections/section-030/module-03/course-02-customizing-the-installation.md
    prompt: "Which flag adds the image automation controllers to a Flux installation?"
    options:
      - id: a
        text: "`--watch-all-namespaces`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: b
        text: "`--components-extra`"
        explanation: "Correct. components-extra lists optional controllers on top of the default ones."
      - id: c
        text: "`--network-policy`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: d
        text: "`--registry`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
    correct_option: b
    explanation: "Correct. components-extra lists optional controllers on top of the default ones."

  - id: ats094-030-m03-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Customize in Git"
    source_readings:
      - sections/section-030/module-03/course-02-customizing-the-installation.md
    prompt: "Where do patches such as `--concurrent=10` belong in a bootstrapped cluster?"
    options:
      - id: a
        text: "In a `kustomization.yaml` next to `gotk-components.yaml`, committed to Git."
        explanation: "Correct. Patches in Git survive an upgrade, and edits with kubectl are reverted when Flux applies the folder."
      - id: b
        text: "In a `kubectl edit` session on the controller."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: c
        text: "In the Secret flux-system."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: d
        text: "In the labels of the GitRepository."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
    correct_option: a
    explanation: "Correct. Patches in Git survive an upgrade, and edits with kubectl are reverted when Flux applies the folder."

  - id: ats094-030-m03-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "Limit cross-namespace references"
    source_readings:
      - sections/section-030/module-03/course-02-customizing-the-installation.md
    prompt: "Which kustomize-controller argument stops an object from using a source in another namespace?"
    options:
      - id: a
        text: "`--concurrent=0`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: b
        text: "`--requeue-dependency=0s`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: c
        text: "`--default-service-account=none`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: d
        text: "`--no-cross-namespace-refs=true`"
        explanation: "Correct. The argument is used in multi-tenant clusters to keep tenants apart."
    correct_option: d
    explanation: "Correct. The argument is used in multi-tenant clusters to keep tenants apart."

  - id: ats094-030-m03-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Delete a pruning Kustomization"
    source_readings:
      - sections/section-030/module-03/course-03-uninstalling-flux.md
    prompt: "A Flux `Kustomization` with `prune: true` is deleted. What happens to the objects it applied?"
    options:
      - id: a
        text: "They keep running unchanged."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: b
        text: "They are moved to the namespace default."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: c
        text: "They are deleted."
        explanation: "Correct. The finalizer garbage collects the inventory before the object is removed."
      - id: d
        text: "They are suspended."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
    correct_option: c
    explanation: "Correct. The finalizer garbage collects the inventory before the object is removed."

  - id: ats094-030-m03-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep objects when you delete"
    source_readings:
      - sections/section-030/module-03/course-03-uninstalling-flux.md
    prompt: "How do you delete a Flux `Kustomization` and keep what it applied?"
    options:
      - id: a
        text: "Delete the GitRepository first."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: b
        text: "Turn `spec.prune` off first, then delete it."
        explanation: "Correct. With pruning off the finalizer does not delete the applied objects."
      - id: c
        text: "Add the label `keep: true` to the Deployment."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: d
        text: "Run `flux reconcile` twice."
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
    correct_option: b
    explanation: "Correct. With pruning off the finalizer does not delete the applied objects."

  - id: ats094-030-m03-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Preview an uninstall"
    source_readings:
      - sections/section-030/module-03/course-03-uninstalling-flux.md
    prompt: "Which flag shows what `flux uninstall` would delete without deleting it?"
    options:
      - id: a
        text: "`--dry-run`"
        explanation: "Correct. dry-run lists the changes without making them."
      - id: b
        text: "`--silent`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: c
        text: "`--keep-namespace`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: d
        text: "`--export`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
    correct_option: a
    explanation: "Correct. dry-run lists the changes without making them."

  - id: ats094-030-m03-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Save what is not in Git"
    source_readings:
      - sections/section-030/module-03/course-04-rebuilding-a-cluster-from-git.md
    prompt: "Which command prints the Flux `Kustomization` objects of a cluster as YAML so they can be kept?"
    options:
      - id: a
        text: "`flux get kustomizations --all`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: b
        text: "`flux check --export`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: c
        text: "`flux tree kustomization`"
        explanation: "Not correct. This does not match how Flux behaves; read the explanation of the correct option."
      - id: d
        text: "`flux export kustomization --all`"
        explanation: "Correct. flux export prints the objects, but not the Secrets that they refer to."
    correct_option: d
    explanation: "Correct. flux export prints the objects, but not the Secrets that they refer to."
