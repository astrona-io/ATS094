# Uninstall Flux And Keep The Workload
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-094-lab-030-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-094-lab-030-03-setup"
      description: "Installs Flux with a pruning Kustomization that runs podinfo, and records the Deployment identity and a ConfigMap to keep"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-flux-removed"
      description: "Confirms no Flux CRDs or controller Deployments remain"
      type: "file"
      source: "validation/validate-flux-removed.sh"
    - name: "validate-workload-kept"
      description: "Confirms the same podinfo Deployment still runs 2 replicas"
      type: "file"
      source: "validation/validate-workload-kept.sh"
    - name: "validate-namespace-kept"
      description: "Confirms flux-system and the ConfigMap team-notes remain"
      type: "file"
      source: "validation/validate-namespace-kept.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
