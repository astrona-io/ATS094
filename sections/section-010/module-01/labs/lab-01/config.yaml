# Make Flux Apply The Application From Git
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-094-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-094-lab-010-01-setup"
      description: "Creates the Secret fleet-auth and a GitRepository and Flux Kustomization with a wrong branch and a wrong path"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-source-ready"
      description: "Confirms the GitRepository fleet follows main and is Ready"
      type: "file"
      source: "validation/validate-source-ready.sh"
    - name: "validate-sync-ready"
      description: "Confirms the Flux Kustomization podinfo applies ./apps/podinfo, prunes, is not suspended and is Ready"
      type: "file"
      source: "validation/validate-sync-ready.sh"
    - name: "validate-podinfo-from-flux"
      description: "Confirms Flux applied podinfo and the Deployment runs 2 ready replicas"
      type: "file"
      source: "validation/validate-podinfo-from-flux.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
