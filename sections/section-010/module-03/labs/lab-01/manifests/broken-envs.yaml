# The starting Flux objects for ats-094-lab-010-03. All of them apply without an
# error. The Flux Kustomization `production` is wrong in two ways:
#   - its path is the staging overlay;
#   - targetNamespace is `staging`, so even the right overlay would land in the
#     staging namespace.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet
  namespace: flux-system
spec:
  interval: 1m
  url: http://gitea.localtest.me:3000/gitops/fleet.git
  ref:
    branch: main
  secretRef:
    name: fleet-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 5m
  path: ./infrastructure/namespaces
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: fleet
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: namespaces
  path: ./apps/podinfo/overlays/staging
  prune: true
  wait: true
  timeout: 3m
  targetNamespace: staging
  sourceRef:
    kind: GitRepository
    name: fleet
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: namespaces
  path: ./apps/podinfo/overlays/staging
  prune: true
  wait: true
  timeout: 3m
  targetNamespace: staging
  sourceRef:
    kind: GitRepository
    name: fleet
