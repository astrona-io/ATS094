# The starting Flux objects for ats-094-lab-010-02. The repository holds two
# folders: infrastructure (a Deployment `cache` in the namespace `platform`)
# and apps/podinfo. Both objects apply without an error and both are wrong:
#   - infra waits for a health check on cache in the namespace `default`,
#     where it does not exist, so infra never becomes Ready;
#   - apps depends on a Flux Kustomization named `infrastructure`, which does
#     not exist (the object is named `infra`), so apps is never applied.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet
  namespace: flux-system
spec:
  interval: 1m
  url: http://gitea.localtest.me:3000/gitops/fleet.git
  ref:
    branch: main
  secretRef:
    name: fleet-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  path: ./infrastructure
  prune: true
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: fleet
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cache
      namespace: default
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  path: ./apps/podinfo
  prune: true
  wait: true
  timeout: 2m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: fleet
