# Fix The Apps Kustomization That Waits Forever
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-094-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-094-lab-010-02-setup"
      description: "Creates the Secret fleet-auth, the GitRepository fleet, and the Flux Kustomizations infra and apps with a wrong health check and a wrong dependency"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-infra-ready"
      description: "Confirms infra applies ./infrastructure, keeps its health check on cache in platform and is Ready"
      type: "file"
      source: "validation/validate-infra-ready.sh"
    - name: "validate-apps-depends-on-infra"
      description: "Confirms apps depends on infra, applies ./apps/podinfo and is Ready"
      type: "file"
      source: "validation/validate-apps-depends-on-infra.sh"
    - name: "validate-workloads-from-flux"
      description: "Confirms cache and podinfo run and were applied by Flux"
      type: "file"
      source: "validation/validate-workloads-from-flux.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
