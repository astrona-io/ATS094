# The starting Flux objects for ats-094-capstone-010. The GitRepository is
# correct. The Flux Kustomization has prune switched off; the seed script also
# suspends it after the first apply.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet
  namespace: flux-system
spec:
  interval: 1m
  url: http://gitea.localtest.me:3000/gitops/fleet.git
  ref:
    branch: main
  secretRef:
    name: fleet-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/podinfo
  prune: false
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: fleet
