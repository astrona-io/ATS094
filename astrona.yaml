      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Make Flux Apply The Application From Git Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 15m
        topic: reconciliation
        task_kind: troubleshooting
        tags: [gitrepository, kustomization, branch, path, flux-get, flux-events]
        learning_goals:
          - Read why a GitRepository and a Flux Kustomization are not Ready from flux get and flux events
          - Fix the branch and the path so Flux applies the application from Git
          - Prove the fix with Ready objects and running podinfo pods
        resources:
          - name: "GitRepository API"
            url: https://fluxcd.io/flux/components/source/gitrepositories/
          - name: "Kustomization API"
            url: https://fluxcd.io/flux/components/kustomize/kustomizations/
      - type: reading
        title: "Drift Correction And Pruning"
        path: sections/section-010/module-01/course-03-drift-correction-and-pruning.md
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: "The Reconciliation Loop In Depth"
        path: sections/section-010/module-02/course.md
      - type: reading
        title: "The Reconcile Cycle And Status Conditions"
        path: sections/section-010/module-02/course-01-the-reconcile-cycle-and-status-conditions.md
      - type: reading
        title: "Intervals, Retries And Health Checks"
        path: sections/section-010/module-02/course-02-intervals-retries-and-health-checks.md
      - type: reading
        title: "Dependencies And Ordering"
        path: sections/section-010/module-02/course-03-dependencies-and-ordering.md
      - type: reading
        title: Question
        path: sections/section-010/module-02/labs/lab-01/question.md
      - type: lab
        title: "Fix The Apps Kustomization That Waits Forever Lab"
        path: sections/section-010/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: reconciliation
        task_kind: troubleshooting
        tags: [dependson, health-checks, kustomization, conditions, reconcile]
        learning_goals:
          - Read the Ready condition to find why a Flux Kustomization waits
          - Correct a health check and a dependsOn entry that point at the wrong objects
          - Prove that both Flux Kustomizations are Ready and the workloads run
        resources:
          - name: "Kustomization API: dependsOn and health checks"
            url: https://fluxcd.io/flux/components/kustomize/kustomizations/
      - type: reading
        title: "Server-Side Apply And Finding What Manages An Object"
        path: sections/section-010/module-02/course-04-server-side-apply-and-finding-what-manages-an-object.md
      - type: reading
        title: "Summary"
        path: sections/section-010/module-02/course-05-summary.md
      - type: quiz
        title: "Knowledge Check: The Reconciliation Loop In Depth"
        path: sections/section-010/module-02/quiz.yaml
        pass_score: 70

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Make Git The Only Source Of Truth Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: gitops-principles
        task_kind: troubleshooting
        tags: [desired-state, drift-detection, prune, kustomization, interval, flux-reconcile]
        learning_goals:
          - Turn on pruning and fix a suspended Flux Kustomization so Git decides what runs
          - Change the application through Git, not through kubectl
          - Prove that Flux reverts a manual change and removes an object deleted from Git
        resources:
          - name: "Core concepts"
            url: https://fluxcd.io/flux/concepts/
          - name: "Kustomization API: prune and suspend"
            url: https://fluxcd.io/flux/components/kustomize/kustomizations/
