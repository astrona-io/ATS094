# Course manifest for ATS094 - Fundamentals & GitOps Toolkit Architecture (FluxCD).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS094
  title: "FluxCD: Fundamentals & GitOps Toolkit Architecture"
  maturity: alpha
  description: >
    Training material covering the Fundamentals & GitOps Toolkit Architecture
    domain of the FluxCD training path: the OpenGitOps principles and
    pull-based delivery, the reconciliation loop and drift correction, the
    GitOps Toolkit controllers and their APIs, the Flux command-line tool
    against the controllers in the cluster, optional components, and
    bootstrapping Flux into a cluster from a Git repository. Each module pairs
    a layered reader with an ungraded hands-on playground and a graded
    practice lab. Each section closes with an integration capstone.
    Written for Flux v2.9.6.

  certification:
    name: FluxCD
    code: FLUX
    provider: Astrona

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

